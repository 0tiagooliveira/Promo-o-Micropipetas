version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: vps/Dockerfile
    container_name: ionlab_promo_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgres://ionlab_user:ionlab_pass@db:5432/ionlab_promo
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: ionlab_promo_db
    restart: always
    environment:
      POSTGRES_DB: ionlab_promo
      POSTGRES_USER: ionlab_user
      POSTGRES_PASSWORD: ionlab_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

volumes:
  postgres_data:
