<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="logoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  
  <!-- Icone da Pipeta / Atomo Ionlab -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#logoBlue)" />
    <!-- Pipeta / Atomo em Vetor -->
    <path d="M 24 10 L 28 10 L 28 20 L 32 24 L 28 28 L 28 38 L 24 38 Z" fill="#FFFFFF" />
    <circle cx="24" cy="14" r="3" fill="#25D366" />
    <circle cx="24" cy="24" r="2" fill="#38BDF8" />
