  </g>
  
  <!-- Texto IONLAB -->
  <text x="70" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="-0.5">IONLAB</text>
  <text x="70" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" fill="#16A34A" letter-spacing="2">EQUIPAMENTOS CIENTÍFICOS</text>
  
  <!-- Badge Promo -->
  <rect x="235" y="16" width="75" height="20" rx="10" fill="#25D366" />
  <text x="272.5" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" text-anchor="middle">PROMO</text>
